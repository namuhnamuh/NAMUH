// Product data — each garment links to its Shopify product page
const PRODUCTS = [
  { name:"NAMUH® Organic Hoodie", price:"£105", url:"/products/organic-hoodie", tex:HOODIE_FRONT, x:-6, z:-4 },
  { name:"NAMUH® Organic Tee", price:"£60", url:"/products/organic-tee", tex:TEE_FRONT, x:-2, z:-8 },
  { name:"NAMUH® Organic Hoodie", price:"£105", url:"/products/organic-hoodie", tex:HOODIE_BACK, x:2.5, z:-7 },
  { name:"NAMUH® Organic Tee", price:"£60", url:"/products/organic-tee", tex:TEE_BACK, x:6.5, z:-3.5 },
];

let scene, camera, renderer, raycaster, mouse;
let garments = [], torches = [], hovered = null;
let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
let isDragging = false, lastX = 0, lastY = 0;

function init(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0806, 0.035);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 4);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x060505);
  document.getElementById("canvas-wrap").appendChild(renderer.domElement);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  buildCave();
  buildGarments();
  buildTorches();

  // ambient low light
  const amb = new THREE.AmbientLight(0x2a1f15, 0.6);
  scene.add(amb);
  // cool fill from above
  const moon = new THREE.DirectionalLight(0x3a4a6a, 0.3);
  moon.position.set(0, 10, -5);
  scene.add(moon);

  addEvents();
  animate();

  // hide loader
  let p = 0;
  const li = setInterval(()=>{
    p += 8;
    document.getElementById("loadFill").style.width = Math.min(p,100)+"%";
    if(p>=100){ clearInterval(li); setTimeout(()=>document.getElementById("loader").classList.add("hide"), 300); }
  }, 60);
}

function makeRockTexture(){
  const c = document.createElement("canvas"); c.width=512; c.height=512;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#1a1512"; ctx.fillRect(0,0,512,512);
  for(let i=0;i<8000;i++){
    const x=Math.random()*512, y=Math.random()*512;
    const v = Math.random();
    const shade = Math.floor(20 + v*35);
    ctx.fillStyle = `rgb(${shade+8},${shade+4},${shade})`;
    ctx.fillRect(x,y,Math.random()*4+1,Math.random()*4+1);
  }
  // darker crevices
  for(let i=0;i<40;i++){
    ctx.strokeStyle = `rgba(0,0,0,${Math.random()*0.3})`;
    ctx.lineWidth = Math.random()*3;
    ctx.beginPath();
    ctx.moveTo(Math.random()*512, Math.random()*512);
    ctx.bezierCurveTo(Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512);
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function buildCave(){
  const rock = makeRockTexture();
  const rockMat = new THREE.MeshStandardMaterial({ map:rock, roughness:0.95, metalness:0.05, side:THREE.BackSide });

  // Cave as a large irregular dome/cylinder around the camera
  const caveGeo = new THREE.CylinderGeometry(16, 20, 24, 32, 8, true);
  // distort vertices for organic rocky feel
  const pos = caveGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const n = (Math.sin(x*0.5)+Math.cos(z*0.5)+Math.sin(y*0.3))*0.8;
    const d = Math.random()*1.2;
    pos.setX(i, x + n*0.5 + d*0.3);
    pos.setZ(i, z + n*0.5 + d*0.3);
  }
  caveGeo.computeVertexNormals();
  const cave = new THREE.Mesh(caveGeo, rockMat);
  cave.position.y = 4;
  scene.add(cave);

  // rocky floor
  const floorTex = rock.clone(); floorTex.needsUpdate = true;
  floorTex.repeat.set(4,4);
  const floorMat = new THREE.MeshStandardMaterial({ map:floorTex, roughness:1, metalness:0 });
  const floorGeo = new THREE.PlaneGeometry(44, 44, 24, 24);
  const fp = floorGeo.attributes.position;
  for(let i=0;i<fp.count;i++){ fp.setZ(i, Math.random()*0.8); }
  floorGeo.computeVertexNormals();
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -6;
  scene.add(floor);

  // ceiling stalactites
  for(let i=0;i<14;i++){
    const h = Math.random()*3+1.5;
    const stal = new THREE.Mesh(
      new THREE.ConeGeometry(Math.random()*0.5+0.2, h, 6),
      rockMat
    );
    stal.position.set((Math.random()-0.5)*24, 9-h/2, -(Math.random()*14+2));
    stal.rotation.x = Math.PI;
    scene.add(stal);
  }
}

function buildGarments(){
  const loader = new THREE.TextureLoader();
  PRODUCTS.forEach((prod, idx)=>{
    const tex = loader.load(prod.tex);
    tex.colorSpace = THREE.SRGBColorSpace;
    // garment plane
    const mat = new THREE.MeshStandardMaterial({ map:tex, transparent:true, roughness:0.8, metalness:0, side:THREE.DoubleSide, emissive:0x151515, emissiveMap:tex, emissiveIntensity:0.15 });
    const geo = new THREE.PlaneGeometry(2.4, 3.2);
    const g = new THREE.Mesh(geo, mat);
    g.position.set(prod.x, -0.5, prod.z);
    g.userData = { product:prod, baseY:-0.5, phase:idx*1.3 };
    scene.add(g);
    garments.push(g);

    // chain from ceiling
    const chainMat = new THREE.MeshStandardMaterial({ color:0x2a2620, roughness:0.6, metalness:0.8 });
    const chainGeo = new THREE.CylinderGeometry(0.02, 0.02, 6, 6);
    const chain = new THREE.Mesh(chainGeo, chainMat);
    chain.position.set(prod.x, 4, prod.z);
    scene.add(chain);

    // hanger bar
    const bar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04,0.04,2.6,8),
      chainMat
    );
    bar.rotation.z = Math.PI/2;
    bar.position.set(prod.x, 1.2, prod.z);
    scene.add(bar);
  });
}

function buildTorches(){
  const torchPos = [[-10,1,-6],[10,1,-6],[-7,1,2],[7,1,2],[0,2,-12]];
  torchPos.forEach(p=>{
    const light = new THREE.PointLight(0xff7722, 2.2, 18, 2);
    light.position.set(p[0],p[1],p[2]);
    scene.add(light);
    // torch flame (glowing sphere)
    const flame = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 8, 8),
      new THREE.MeshBasicMaterial({ color:0xffaa44 })
    );
    flame.position.copy(light.position);
    scene.add(flame);
    // bracket
    const bracket = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05,0.05,0.6,6),
      new THREE.MeshStandardMaterial({ color:0x1a1410, roughness:0.9 })
    );
    bracket.position.set(p[0], p[1]-0.4, p[2]);
    scene.add(bracket);
    torches.push({ light, flame, base:light.intensity, x:p[0] });
  });
}

function addEvents(){
  const el = renderer.domElement;
  el.addEventListener("mousedown", e=>{ isDragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener("mouseup", ()=> isDragging=false);
  window.addEventListener("mousemove", e=>{
    if(isDragging){
      targetYaw -= (e.clientX-lastX)*0.004;
      targetPitch -= (e.clientY-lastY)*0.004;
      targetPitch = Math.max(-0.4, Math.min(0.4, targetPitch));
      lastX=e.clientX; lastY=e.clientY;
    }
    mouse.x = (e.clientX/window.innerWidth)*2-1;
    mouse.y = -(e.clientY/window.innerHeight)*2+1;
    checkHover(e.clientX, e.clientY);
  });
  // touch
  el.addEventListener("touchstart", e=>{ isDragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }, {passive:true});
  window.addEventListener("touchend", ()=> isDragging=false);
  window.addEventListener("touchmove", e=>{
    if(isDragging){
      targetYaw -= (e.touches[0].clientX-lastX)*0.005;
      targetPitch -= (e.touches[0].clientY-lastY)*0.005;
      targetPitch = Math.max(-0.4, Math.min(0.4, targetPitch));
      lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    }
  }, {passive:true});

  el.addEventListener("click", e=>{
    if(hovered){ 
      // In real Shopify this navigates to the product. Here we show the intent.
      window.location.href = hovered.userData.product.url;
    }
  });

  window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function checkHover(px, py){
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(garments);
  const tt = document.getElementById("tooltip");
  if(hits.length){
    hovered = hits[0].object;
    document.body.style.cursor = "pointer";
    const p = hovered.userData.product;
    tt.querySelector(".tt-name").textContent = p.name;
    tt.querySelector(".tt-price").textContent = p.price;
    tt.style.left = px+"px"; tt.style.top = py+"px";
    tt.classList.add("show");
  } else {
    hovered = null;
    document.body.style.cursor = "default";
    tt.classList.remove("show");
  }
}

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t += 0.016;

  yaw += (targetYaw-yaw)*0.08;
  pitch += (targetPitch-pitch)*0.08;
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // flicker torches
  torches.forEach((tor,i)=>{
    const f = tor.base + Math.sin(t*8+i)*0.4 + Math.random()*0.3;
    tor.light.intensity = f;
    tor.flame.scale.setScalar(0.9+Math.sin(t*10+i)*0.15);
  });

  // sway garments gently
  garments.forEach(g=>{
    g.rotation.y = Math.sin(t*0.5+g.userData.phase)*0.15;
    g.position.y = g.userData.baseY + Math.sin(t*0.8+g.userData.phase)*0.08;
    // highlight hovered
    if(g===hovered){ g.material.emissiveIntensity += (0.5-g.material.emissiveIntensity)*0.2; }
    else { g.material.emissiveIntensity += (0.15-g.material.emissiveIntensity)*0.2; }
  });

  renderer.render(scene, camera);
}

init();
</script>
